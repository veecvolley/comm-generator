  # Template 2 : Design compact avec espacement réduit
  template2:
    name: "Design Compact"
    description: "Version avec espacement réduit entre les matchs"
    inherit_from: "template1"

    # Modifications par rapport au template1
    offsets_y:
      delta: 60          # Espacement réduit (80 -> 60)


  # Template 3 : Design large avec éléments plus grands
  template3:
    name: "Design Large"
    description: "Version avec éléments plus grands et plus espacés"
    inherit_from: "template1"

    # Modifications par rapport au template1
    fonts:
      title: 45          # Titre plus grand (35 -> 45)
      date_title: 25     # Date titre plus grande (20 -> 25)
      bold_15: 18        # Textes légèrement plus grands

    offsets_y:
      delta: 100         # Espacement augmenté (80 -> 100)

    sizes:
      logo_width: 75     # Logos plus grands (65 -> 75)
      logo_height: 75
      place_icon: 45     # Icône plus grande (40 -> 45)

