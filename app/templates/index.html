<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Comm' Generator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar bg-white shadow-sm px-3 px-md-4 py-2 mb-4 d-flex justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <img src="/static/img/logo.png" height="40" alt="Logo">
      <span class="fw-bold fs-5 text-primary">{{ club_name or "Comm' Generator" }}</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span id="statusMsg" class="small text-muted d-none"></span>
      <button id="refreshConfigBtn" class="btn btn-sm btn-outline-secondary" title="Rafraîchir les catégories">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
      <button id="clearCacheBtn" class="btn btn-sm btn-outline-secondary" title="Vider le cache">
        <i class="bi bi-trash3"></i>
      </button>
      <a href="/admin/" class="btn btn-sm btn-outline-primary">
        <i class="bi bi-gear-fill me-1"></i>Admin
      </a>
    </div>
  </nav>

  <!-- Main layout -->
  <div class="container-fluid px-3 px-md-4">
    <div class="row g-4">

      <!-- Form column -->
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-4">
            <form id="filterForm">

              <!-- Saison -->
              <div class="mb-3">
                <label for="saison" class="form-label fw-semibold">
                  <i class="bi bi-calendar3 me-1"></i>Saison
                </label>
                <select id="saison" name="saison" class="form-select">
                  {% for s in saisons %}
                  <option value="{{ s | replace('/', '-') }}"{% if loop.first %} selected{% endif %}>{{ s | replace('-', ' / ') }}</option>
                  {% else %}
                  <option value="2025-2026" selected>2025 / 2026</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Mode -->
              <div class="mb-3">
                <label for="mode" class="form-label fw-semibold">
                  <i class="bi bi-clipboard-list me-1"></i>Type
                </label>
                <select id="mode" name="mode" class="form-select">
                  <option value="planning" selected>Planning</option>
                  <option value="results">Résultats</option>
                </select>
              </div>

              <!-- Titre -->
              <div class="mb-3">
                <label for="title" class="form-label fw-semibold">
                  <i class="bi bi-type me-1"></i>Titre
                </label>
                <input type="text" id="title" name="title" class="form-control" placeholder="Ex: Week-end de Matchs !!">
              </div>

              <!-- Format -->
              <div class="mb-3">
                <label class="form-label fw-semibold d-block">
                  <i class="bi bi-image me-1"></i>Format
                </label>
                <div class="btn-group" role="group" aria-label="Format">
                  <input type="radio" class="btn-check" name="format" id="formatPub" value="pub" checked autocomplete="off">
                  <label class="btn btn-outline-secondary" for="formatPub">Publication</label>

                  <input type="radio" class="btn-check" name="format" id="formatStory" value="story" autocomplete="off">
                  <label class="btn btn-outline-secondary" for="formatStory">Story</label>
                </div>
              </div>

              <!-- Template -->
              <div class="mb-3">
                <label for="template" class="form-label fw-semibold">
                  <i class="bi bi-palette me-1"></i>Template
                </label>
                <select id="template" name="template" class="form-select">
                  <option value="">Chargement des templates...</option>
                </select>
              </div>

              <!-- Catégories -->
              <div class="mb-3">
                <label for="categories" class="form-label fw-semibold">
                  <i class="bi bi-list-ul me-1"></i>Catégories
                </label>
                <select id="categories" name="categories" multiple class="form-select" size="7"></select>
              </div>

              <!-- Dates -->
              <div class="row g-2 mb-4">
                <div class="col-6">
                  <label for="date_start" class="form-label fw-semibold">
                    <i class="bi bi-calendar-day me-1"></i>Date début
                  </label>
                  <input type="date" id="date_start" name="date_start" class="form-control">
                </div>
                <div class="col-6">
                  <label for="date_end" class="form-label fw-semibold">
                    <i class="bi bi-calendar-week me-1"></i>Date fin
                  </label>
                  <input type="date" id="date_end" name="date_end" class="form-control">
                </div>
              </div>

              <!-- Submit -->
              <button type="submit" class="btn btn-primary w-100">
                <span id="loading" class="d-none">
                  <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Génération...
                </span>
                <span id="generateLabel"><i class="bi bi-image-fill me-1"></i>Générer l'image</span>
              </button>

            </form>
          </div>
        </div>
      </div>

      <!-- Image column -->
      <div class="col-lg-7">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center">

            <!-- Empty state -->
            <div id="emptyState" class="text-center text-muted py-5">
              <i class="bi bi-image" style="font-size:4rem;opacity:0.25;"></i>
              <p class="mt-3 mb-0">L'image générée apparaîtra ici</p>
            </div>

            <!-- Result image -->
            <img id="resultImg" class="img-fluid rounded d-none" style="cursor:zoom-in;" alt="Image générée">

            <!-- Action buttons (hidden until image is ready) -->
            <div id="imageActions" class="d-none mt-3 d-flex gap-2">
              <button id="downloadBtn" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-download me-1"></i>Télécharger
              </button>
              <button id="shareBtn" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-share me-1"></i>Partager
              </button>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Version -->
  <div id="versionInfo">Version : {{ version }}</div>

  <!-- Lightbox Modal -->
  <div id="imgModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;z-index:9999;">
    <span id="imgModalClose" style="position:absolute;top:20px;right:28px;font-size:32px;color:#fff;cursor:pointer;">&times;</span>
    <img id="imgModalContent" src="" alt="Agrandissement" style="max-width:90%;max-height:90%;">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/script.js" defer></script>
</body>
</html>
