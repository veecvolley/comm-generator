<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Comm' Generator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar bg-white shadow-sm px-3 px-md-4 py-2 mb-4 d-flex justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <img src="/static/img/logo.png" height="40" alt="Logo">
      <span class="fw-bold fs-5 text-primary">Comm' Generator</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span id="statusMsg" class="small text-muted d-none"></span>

      <!-- Sync FFVB -->
      <div class="d-flex align-items-center gap-1">
        <button id="syncFfvbBtn" class="btn btn-sm btn-outline-success" title="Synchroniser les données FFVB">
          <i class="bi bi-cloud-download"></i>
        </button>
        <span id="lastSyncLabel" class="small text-muted" style="white-space:nowrap;">
          {% if last_sync %}
            <i class="bi bi-clock me-1"></i>{{ last_sync }}
          {% else %}
            <span class="fst-italic">jamais synchronisé</span>
          {% endif %}
        </span>
      </div>

      <div class="vr mx-1"></div>

      <button id="refreshConfigBtn" class="btn btn-sm btn-outline-secondary" title="Rafraîchir les catégories">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
      <button id="clearCacheBtn" class="btn btn-sm btn-outline-secondary" title="Vider le cache">
        <i class="bi bi-trash3"></i>
      </button>
      <a href="/admin/" class="btn btn-sm btn-outline-primary">
        <i class="bi bi-gear-fill me-1"></i>Admin
      </a>
    </div>
  </nav>

  <!-- Main layout -->
  <div class="container-fluid px-3 px-md-4 pb-5">
    <form id="filterForm">

      <!-- Bouton Générer (centré, au-dessus des colonnes) -->
      <div class="row mb-3">
        <div class="col-md-6 col-lg-4 mx-auto">
          <button type="submit" class="btn btn-primary w-100 btn-lg">
            <span id="loading" class="d-none">
              <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Génération...
            </span>
            <span id="generateLabel"><i class="bi bi-image-fill me-1"></i>Générer l'image</span>
          </button>
        </div>
      </div>

      <!-- Row 1 : paramètres (gauche) + catégories (droite) -->
      <div class="row g-4 mb-4 align-items-start">

        <!-- Colonne gauche : paramètres -->
        <div class="col-lg-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4 d-flex flex-column gap-3">

              <!-- Saison -->
              <div>
                <label for="saison" class="form-label fw-semibold mb-1">
                  <i class="bi bi-calendar3 me-1"></i>Saison
                </label>
                <select id="saison" name="saison" class="form-select">
                  {% for s in saisons %}
                  <option value="{{ s | replace('/', '-') }}"{% if loop.first %} selected{% endif %}>{{ s | replace('-', ' / ') }}</option>
                  {% else %}
                  <option value="2025-2026" selected>2025 / 2026</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Mode -->
              <div>
                <label class="form-label fw-semibold mb-1 d-block">
                  <i class="bi bi-clipboard-list me-1"></i>Type
                </label>
                <div class="btn-group" role="group" aria-label="Type">
                  <input type="radio" class="btn-check" name="mode" id="modePlanning" value="planning" checked autocomplete="off">
                  <label class="btn btn-outline-secondary" for="modePlanning">
                    <i class="bi bi-calendar2-week me-1"></i>Planning
                  </label>
                  <input type="radio" class="btn-check" name="mode" id="modeResults" value="results" autocomplete="off">
                  <label class="btn btn-outline-secondary" for="modeResults">
                    <i class="bi bi-trophy me-1"></i>Résultats
                  </label>
                </div>
              </div>

              <!-- Titre -->
              <div>
                <label for="title" class="form-label fw-semibold mb-1">
                  <i class="bi bi-type me-1"></i>Titre
                </label>
                <input type="text" id="title" name="title" class="form-control" placeholder="Ex: Week-end de Matchs !!">
              </div>

              <!-- Format -->
              <div>
                <label class="form-label fw-semibold mb-1 d-block">
                  <i class="bi bi-image me-1"></i>Format
                </label>
                <div class="btn-group" role="group" aria-label="Format">
                  <input type="radio" class="btn-check" name="format" id="formatPub" value="pub" checked autocomplete="off">
                  <label class="btn btn-outline-secondary" for="formatPub">Publication</label>
                  <input type="radio" class="btn-check" name="format" id="formatStory" value="story" autocomplete="off">
                  <label class="btn btn-outline-secondary" for="formatStory">Story</label>
                </div>
              </div>

              <!-- Template -->
              <div>
                <label for="template" class="form-label fw-semibold mb-1">
                  <i class="bi bi-palette me-1"></i>Template
                </label>
                <select id="template" name="template" class="form-select">
                  <option value="">Chargement des templates...</option>
                </select>
              </div>

              <!-- Dates -->
              <div class="row g-2">
                <div class="col-6">
                  <label for="date_start" class="form-label fw-semibold mb-1">
                    <i class="bi bi-calendar-day me-1"></i>Date début
                  </label>
                  <input type="date" id="date_start" name="date_start" class="form-control">
                </div>
                <div class="col-6">
                  <label for="date_end" class="form-label fw-semibold mb-1">
                    <i class="bi bi-calendar-week me-1"></i>Date fin
                  </label>
                  <input type="date" id="date_end" name="date_end" class="form-control">
                </div>
              </div>

            </div>
          </div>
        </div>

        <!-- Colonne droite : catégories -->
        <div class="col-lg-9">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

              <label class="form-label fw-semibold mb-2">
                <i class="bi bi-list-ul me-1"></i>Catégories
              </label>

              <!-- Filtre + tout sélectionner -->
              <div class="input-group input-group-sm mb-2">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="catFilter" class="form-control" placeholder="Filtrer par type, niveau, titre…">
                <button type="button" id="catSelectAll" class="btn btn-outline-secondary" title="Tout sélectionner / désélectionner">
                  <i class="bi bi-check2-all"></i>
                </button>
              </div>

              <!-- Tableau catégories -->
              <div id="catTableWrapper">
                <table class="table table-sm table-hover mb-0" id="catTable">
                  <thead class="table-light" style="position:sticky;top:0;z-index:1;">
                    <tr>
                      <th style="width:36px;"></th>
                      <th>Label</th>
                      <th>Type</th>
                      <th>Genre</th>
                      <th>Niveau</th>
                      <th>Titre</th>
                    </tr>
                  </thead>
                  <tbody id="catTableBody">
                    <tr><td colspan="6" class="text-muted text-center py-3">Chargement…</td></tr>
                  </tbody>
                </table>
              </div>

            </div>
          </div>
        </div>

      </div><!-- /row 1 -->

      <!-- Row 2 : image générée (pleine largeur) -->
      <div class="row">
        <div class="col-12">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center" style="min-height:260px;">

              <!-- Empty state -->
              <div id="emptyState" class="text-center text-muted py-4">
                <i class="bi bi-image" style="font-size:4rem;opacity:0.25;"></i>
                <p class="mt-3 mb-0">L'image générée apparaîtra ici</p>
              </div>

              <!-- Result image -->
              <img id="resultImg" class="img-fluid rounded d-none" style="cursor:zoom-in;max-height:600px;" alt="Image générée">

              <!-- Action buttons -->
              <div id="imageActions" class="d-none mt-3 d-flex gap-2">
                <button id="downloadBtn" class="btn btn-outline-secondary btn-sm">
                  <i class="bi bi-download me-1"></i>Télécharger
                </button>
                <button id="shareBtn" class="btn btn-outline-secondary btn-sm">
                  <i class="bi bi-share me-1"></i>Partager
                </button>
              </div>

            </div>
          </div>
        </div>
      </div><!-- /row 2 -->

    </form>
  </div>

  <!-- Version -->
  <div id="versionInfo">Version : {{ version }}</div>

  <!-- Lightbox Modal -->
  <div id="imgModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;z-index:9999;">
    <span id="imgModalClose" style="position:absolute;top:20px;right:28px;font-size:32px;color:#fff;cursor:pointer;">&times;</span>
    <img id="imgModalContent" src="" alt="Agrandissement" style="max-width:90%;max-height:90%;">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/script.js" defer></script>
</body>
</html>
