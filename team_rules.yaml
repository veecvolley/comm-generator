# Configuration des règles de pseudonymes d'équipes
# Les règles sont évaluées dans l'ordre, la première correspondance gagne
# Plus les règles sont spécifiques, plus elles doivent être en haut

team_detection_pattern: "fs val d'europe esbly coupvray"

rules:
  # SVA - Volley-Assis
  - match:
      label: "SVA"
      type: "Volley-Assis"
    result:
      pseudo: "SVA"
      font_size: "bold_25"

  # Seniors Féminins - Championnat Régional
  - match:
      label: "SF"
      genre: "Féminin"
      type: "Volley-Ball"
      niveau: "Championnat Régional"
    result:
      pseudo_template: "SF{num}"
      font_size: "bold_25"

